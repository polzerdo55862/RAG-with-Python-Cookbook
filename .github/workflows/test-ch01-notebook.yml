name: Test ch01 RAG Intro Notebook

on:
  push:
    paths:
      - "ch01_RAG_intro/**"
      - ".github/workflows/test-ch01-notebook.yml"
  pull_request:
    paths:
      - "ch01_RAG_intro/**"
      - ".github/workflows/test-ch01-notebook.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ch01_RAG_intro/requirements.txt

      - name: Install dependencies
        run: pip install -r ch01_RAG_intro/requirements.txt

      - name: Run unit tests
        run: pytest ch01_RAG_intro/tests/ -v --tb=short
